[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "IEnSF"
version = "0.1.0"
description = "Iterative Ensemble Score Filter (IEnSF) for nonlinear data assimilation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zezhong Zhang" }]
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "pandas",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
